<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070c">
  <title>Телефон</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone-app">

    <!-- ====== DIALER ====== -->
    <section class="screen dialer" id="dialerScreen">
      <header class="topbar">
        <div class="clock" id="clock">00:00</div>
        <div class="status-icons">
          <svg viewBox="0 0 18 12" width="17" height="11" fill="currentColor" aria-hidden="true">
            <rect x="0"  y="8" width="3" height="4" rx="0.7"/>
            <rect x="5"  y="5.5" width="3" height="6.5" rx="0.7"/>
            <rect x="10" y="3" width="3" height="9" rx="0.7"/>
            <rect x="15" y="0" width="3" height="12" rx="0.7"/>
          </svg>
          <svg viewBox="0 0 28 12" width="26" height="11" aria-hidden="true">
            <rect x="0.5" y="0.5" width="24" height="11" rx="3"
                  fill="none" stroke="currentColor" stroke-width="1" opacity="0.45"/>
            <rect x="2" y="2" width="17" height="8" rx="1.6" fill="currentColor"/>
            <rect x="26" y="4" width="1.6" height="4" rx="0.8" fill="currentColor" opacity="0.5"/>
          </svg>
        </div>
      </header>

      <div class="display-zone">
        <div class="number-row">
          <div class="dialed-number" id="dialedNumber">
            <span class="placeholder">Введите номер</span>
          </div>
          <button class="backspace-btn" id="backspaceBtn" hidden aria-label="Удалить">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="keypad" id="keypad">
        <button class="key" data-key="1"><span class="digit">1</span></button>
        <button class="key" data-key="2"><span class="digit">2</span><span class="sub">ABC</span></button>
        <button class="key" data-key="3"><span class="digit">3</span><span class="sub">DEF</span></button>
        <button class="key" data-key="4"><span class="digit">4</span><span class="sub">GHI</span></button>
        <button class="key" data-key="5"><span class="digit">5</span><span class="sub">JKL</span></button>
        <button class="key" data-key="6"><span class="digit">6</span><span class="sub">MNO</span></button>
        <button class="key" data-key="7"><span class="digit">7</span><span class="sub">PQRS</span></button>
        <button class="key" data-key="8"><span class="digit">8</span><span class="sub">TUV</span></button>
        <button class="key" data-key="9"><span class="digit">9</span><span class="sub">WXYZ</span></button>
        <button class="key" data-key="*"><span class="digit">*</span></button>
        <button class="key" data-key="0"><span class="digit">0</span><span class="sub">+</span></button>
        <button class="key" data-key="#"><span class="digit">#</span></button>
      </div>

      <div class="call-row">
        <button class="call-btn" id="callBtn" aria-label="Позвонить">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
            <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- ====== CALL SCREEN ====== -->
    <section class="screen call is-hidden" id="callScreen" data-state="">
      <div class="call-top">
        <div class="contact-avatar" id="contactAvatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="62" height="62" fill="currentColor">
            <path d="M12 12c2.8 0 5-2.2 5-5s-2.2-5-5-5-5 2.2-5 5 2.2 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
          </svg>
        </div>
        <h1 class="call-name" id="callName">—</h1>
        <div class="call-number" id="callNumber">—</div>
        <div class="call-status" id="callStatus">Соединение…</div>
        <div class="call-timer" id="callTimer"></div>
      </div>

      <div class="call-bottom">
        <button class="hangup-btn" id="hangupBtn" aria-label="Сбросить">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
            <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.7l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
          </svg>
        </button>
      </div>
    </section>

  </div>

  <audio id="player" preload="auto"></audio>

  <script src="numbers.js"></script>
  <script src="script.js"></script>
</body>
</html>
